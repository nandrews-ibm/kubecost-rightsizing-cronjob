apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecost-rightsizing-ui
  namespace: kubecost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubecost-rightsizing-ui
  template:
    metadata:
      labels:
        app: kubecost-rightsizing-ui
    spec:
      serviceAccountName: kubecost-rightsizing-ui
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: ui
        image: natea123/kubecost-rightsizing-ui:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: NAMESPACE
          value: kubecost
        - name: CRONJOB_NAME
          value: kubecost-rightsizing
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: kubecost-rightsizing-ui
  namespace: kubecost
spec:
  selector:
    app: kubecost-rightsizing-ui
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
---
