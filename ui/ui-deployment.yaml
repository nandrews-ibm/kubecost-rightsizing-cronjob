---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubecost-rightsizing-ui
  namespace: kubecost
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubecost-rightsizing-ui
  namespace: kubecost
rules:
- apiGroups: ["batch"]
  resources: ["cronjobs"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubecost-rightsizing-ui
  namespace: kubecost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubecost-rightsizing-ui
subjects:
- kind: ServiceAccount
  name: kubecost-rightsizing-ui
  namespace: kubecost
